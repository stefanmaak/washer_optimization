[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "washing-interface-service"
version = "0.1.0"
description = "HTTP interface service for BlueWasher protocol optimization tests"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2",
]

[project.optional-dependencies]
client = ["httpx>=0.27"]
platform = ["sila2>=0.12"]
# --sim needs labscheduler (CP-Solver), laborchestrator, pythonlab and bluewasher_sila (mock Chris);
# bluewasher_sila is not on PyPI, so it is pulled from git
sim = [
    "dash>=2.14",
    "plotly>=5",
    "numpy",
    "pyyaml",
    "networkx",
    "httpx>=0.27",
    "uulabscheduler[cpsolver]",
    "uulaborchestrator",
    "uuPythonlab",
    "bluewasher_sila @ git+https://gitlab.com/OpenLabAutomation/device-integration/bluewasher.git",
]
dev = ["httpx>=0.27", "pytest"]

[project.scripts]
washing_interface_service = "interface_service.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"interface_service.sim" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
